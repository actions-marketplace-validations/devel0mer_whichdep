name: publish-npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. v0.0.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)"
          mkdir -p dist
          tar -czf "dist/whichdep-v${VERSION}-${TARGET}.tar.gz" -C "target/${TARGET}/release" whichdep
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*.tar.gz

  upload-release-assets:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Upload tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)"
          TAG="${EVENT_TAG:-${INPUT_TAG:-v${VERSION}}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" dist/*.tar.gz --title "$TAG" --generate-notes
          fi

  publish-npm:
    needs: [upload-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Prepare npm package files
        run: |
          cp README.md npm/README.md
          cp LICENSE npm/LICENSE
          chmod +x npm/bin/whichdep.js npm/bin/install.js
      - name: Update npm for Trusted Publishing
        run: npm install -g npm@latest
      - name: Show npm version
        run: npm --version
      - name: Publish to npm via Trusted Publishing
        working-directory: npm
        run: npm publish --provenance --access public
