[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "whichdep"
version = "0.1.1"
description = "git bisect for lockfiles — isolate which dependency update broke your build"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = [
    "bisect",
    "delta-debugging",
    "dependencies",
    "lockfile",
    "regression",
    "uv",
    "pip",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/devel0mer/whichdep"
Repository = "https://github.com/devel0mer/whichdep"
Issues = "https://github.com/devel0mer/whichdep/issues"

[tool.maturin]
bindings = "bin"
strip = true
